name: booking-service CI/CD

on:
  push:
    paths:
      - 'services/booking-service/**'
    branches: [ main ]
  pull_request:
    paths:
      - 'services/booking-service/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/services/booking-service/requirements.txt') }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f services/booking-service/requirements.txt ]; then pip install -r services/booking-service/requirements.txt; fi
      - name: Run tests
        run: |
          cd services/booking-service
          python -m pytest -q
      - name: Lint (optional)
        run: |
          pip install flake8 || true
          flake8 services/booking-service || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: services/booking-service
          file: services/booking-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/booking-service:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH (run server script)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export GITHUB_SHA=${{ github.sha }}
            /opt/booking/deploy.sh
