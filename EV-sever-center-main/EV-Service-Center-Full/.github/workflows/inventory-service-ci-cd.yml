name: Inventory Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "EV-sever-center-main/EV-Service-Center-Full/services/inventory-service/**"
      - "EV-sever-center-main/EV-Service-Center-Full/.github/workflows/inventory-service-ci-cd.yml"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EV-sever-center-main/EV-Service-Center-Full/services/inventory-service

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Run Coverage
        run: |
          pytest --cov=. --cov-report=term

  deploy:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: EV-sever-center-main/EV-Service-Center-Full/services/inventory-service

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t inventory-service:latest .

      - name: Verify Image
        run: |
          docker images
