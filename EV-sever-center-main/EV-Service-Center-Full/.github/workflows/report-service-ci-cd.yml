name: Report Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "EV-sever-center-main/EV-Service-Center-Full/services/report-service/**"
      - "EV-sever-center-main/EV-Service-Center-Full/.github/workflows/report-service-ci-cd.yml"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EV-sever-center-main/EV-Service-Center-Full/services/report-service

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install Flask Flask-SQLAlchemy Flask-Migrate Flask-JWT-Extended flask-cors requests python-dotenv redis

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Run Coverage
        run: |
          pytest --cov=. --cov-report=term

  deploy:
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        working-directory: EV-sever-center-main/EV-Service-Center-Full/services/report-service

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t report-service:latest .

      - name: Verify Image
        run: |
          docker images