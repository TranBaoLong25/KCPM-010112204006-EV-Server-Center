- name: Run Postman Collection
  id: newman
  continue-on-error: true
  run: |
    newman run postman/EV-Server-Center.postman_collection.json 2>&1 | tee newman-result.log

- name: Create Jira bug if Postman fails
  if: steps.newman.outcome == 'failure'
  run: |
    SUMMARY="[API TEST FAILED] Postman collection failed on GitHub Actions"

    DESCRIPTION="Postman/Newman test failed.\n\nRepo: $GITHUB_REPOSITORY\nBranch: $GITHUB_REF_NAME\nCommit: $GITHUB_SHA\nWorkflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\nLog:\n$(tail -n 80 newman-result.log)"

    jq -n \
      --arg project "${{ secrets.JIRA_PROJECT_KEY }}" \
      --arg summary "$SUMMARY" \
      --arg description "$DESCRIPTION" \
      '{
        fields: {
          project: { key: $project },
          summary: $summary,
          description: {
            type: "doc",
            version: 1,
            content: [
              {
                type: "paragraph",
                content: [
                  {
                    type: "text",
                    text: $description
                  }
                ]
              }
            ]
          },
          issuetype: { name: "Bug" }
        }
      }' > jira-payload.json

    curl -X POST \
      -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_TOKEN }}" \
      -H "Accept: application/json" \
      -H "Content-Type: application/json" \
      --data @jira-payload.json \
      "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue"

- name: Fail workflow after Jira bug created
  if: steps.newman.outcome == 'failure'
  run: exit 1
