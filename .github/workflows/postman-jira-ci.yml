name: Postman API Tests with Jira

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Start Docker services
        working-directory: EV-sever-center-main/EV-Service-Center-Full
        run: |
          docker compose up -d --build
          sleep 90

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Collection
        id: newman
        continue-on-error: true
        run: |
          newman run postman/EV-Server-Center.postman_collection.json \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Create Jira bugs for failed Postman tests
        if: steps.newman.outcome == 'failure'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const report = JSON.parse(fs.readFileSync("newman-report.json", "utf8"));
          const executions = report.run.executions || [];

          const failedItems = [];

          for (const execution of executions) {
            const itemName = execution.item?.name || "Unknown Postman request";
            const assertions = execution.assertions || [];

            for (const assertion of assertions) {
              if (assertion.error) {
                failedItems.push({
                  itemName,
                  assertionName: assertion.assertion || "Unknown assertion",
                  errorMessage: assertion.error.message || "Unknown error"
                });
              }
            }
          }

          const limitedFails = failedItems.slice(0, 10);

          async function createJiraIssue(fail) {
            const summary = `[API TEST FAILED] ${fail.itemName}`;

            const descriptionText =
          `Postman/Newman testcase failed.

          Testcase: ${fail.itemName}
          Assertion: ${fail.assertionName}
          Error: ${fail.errorMessage}

          Repository: ${process.env.GITHUB_REPOSITORY}
          Branch: ${process.env.GITHUB_REF_NAME}
          Commit: ${process.env.GITHUB_SHA}
          Workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const payload = {
              fields: {
                project: {
                  key: process.env.JIRA_PROJECT_KEY
                },
                summary,
                description: {
                  type: "doc",
                  version: 1,
                  content: [
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: descriptionText
                        }
                      ]
                    }
                  ]
                },
                issuetype: {
                  name: "Bug"
                }
              }
            };

            const auth = Buffer.from(`${process.env.JIRA_EMAIL}:${process.env.JIRA_TOKEN}`).toString("base64");

            const response = await fetch(`${process.env.JIRA_BASE_URL}/rest/api/3/issue`, {
              method: "POST",
              headers: {
                "Authorization": `Basic ${auth}`,
                "Accept": "application/json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            });

            const result = await response.text();

            if (!response.ok) {
              console.error("Failed to create Jira issue:", response.status, result);
              process.exitCode = 1;
            } else {
              console.log("Created Jira issue:", result);
            }
          }

          (async () => {
            if (limitedFails.length === 0) {
              console.log("No failed assertions found in Newman report.");
              return;
            }

            console.log(`Creating ${limitedFails.length} Jira bug(s)...`);

            for (const fail of limitedFails) {
              await createJiraIssue(fail);
            }
          })();
          NODE

      - name: Fail workflow after Jira bugs created
        if: steps.newman.outcome == 'failure'
        run: exit 1
