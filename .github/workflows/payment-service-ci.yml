name: Payment Service CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask Flask-SQLAlchemy Flask-Migrate Flask-Cors pytest pytest-cov requests Flask-JWT-Extended python-dotenv

    - name: Run CI Tests & Code Coverage
      run: |
        cd EV-sever-center-main/EV-Service-Center-Full/services/payment-service
        python run_tests.py
